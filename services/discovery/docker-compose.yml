services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: ${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}
      POSTGRES_DB: discovery
    volumes:
      - discovery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U discovery -d discovery"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    volumes:
      - discovery_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      retries: 15
  migrate:
    build: .
    env_file: discovery.env
    environment:
      DATABASE_URL: postgresql://discovery:${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}@postgres:5432/discovery?schema=public
      REDIS_URL: redis://redis:6379
    command: ["npm","run","db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    env_file: discovery.env
    environment:
      DATABASE_URL: postgresql://discovery:${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}@postgres:5432/discovery?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3100
      DISCOVERY_BIND_HOST: 0.0.0.0
    ports: ["127.0.0.1:3100:3100"]
    command: ["npm","run","start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: discovery.env
    environment:
      DATABASE_URL: postgresql://discovery:${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}@postgres:5432/discovery?schema=public
      REDIS_URL: redis://redis:6379
    command: ["npm","run","worker:start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  discovery_postgres:
  discovery_redis:
